name: CI

on:
  push:
    branches: ["main", "INPROOM-*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly: exhaustive role x route matrix (INPROOM_FULL_MATRIX)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - lint, migrate, test, contract
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: inproom
          POSTGRES_PASSWORD: inproom
          POSTGRES_DB: inproom
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U inproom -d inproom"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      INPROOM_DATABASE_URL: postgresql+psycopg://inproom:inproom@localhost:55432/inproom
      INPROOM_TEST_DATABASE_URL: postgresql+psycopg://inproom:inproom@localhost:55432/inproom
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test (includes tenant isolation and RBAC suites)
        run: uv run pytest -v
        env:
          INPROOM_ISOLATION_REPORT: ${{ github.workspace }}/apps/api/build/isolation-matrix.md
          INPROOM_RBAC_REPORT: ${{ github.workspace }}/apps/api/build/rbac-matrix-results.md
          # Pushes run the targeted matrix; the nightly schedule runs every actor on every route.
          INPROOM_FULL_MATRIX: ${{ github.event_name == 'schedule' && '1' || '' }}
      - name: Upload tenant isolation matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-matrix
          path: apps/api/build/isolation-matrix.md
          if-no-files-found: warn
      - name: Upload RBAC route x role matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-matrix-results
          path: apps/api/build/rbac-matrix-results.md
          if-no-files-found: warn
      - name: Contract drift
        run: uv run python scripts/export_openapi.py --check
      - name: Role matrix drift
        run: uv run python scripts/export_rbac_matrix.py --check

  web:
    name: Web - typecheck and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match the OpenAPI contract
        run: npm run gen:api:check
      - run: npm run typecheck
      - run: npm run build
