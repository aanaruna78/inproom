<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INPROOM V2.1 · Design Review</title><style>:root{color-scheme:light;font:14px system-ui,Arial;color:#172033;background:#f7f8fa}body{margin:0}header{padding:19px 26px;background:#101828;color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center}header strong{letter-spacing:.05em;font-size:19px}main{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1800px;margin:auto}aside{padding:20px;background:white;border-right:1px solid #e7e9ef;max-height:calc(100vh - 65px);overflow:auto}button{width:100%;margin:2px 0;text-align:left;background:transparent;border:0;border-radius:8px;padding:12px;cursor:pointer;color:#344054;font:inherit}button[aria-selected=true]{background:#efedff;color:#4033cc;font-weight:700}button:focus-visible{outline:3px solid #5546e8}section{padding:24px;min-width:0}h1{font-size:24px;margin:0 0 5px}p{color:#667085;margin:0 0 17px}figure{margin:0;background:white;border:1px solid #e7e9ef;border-radius:13px;padding:9px;box-shadow:0 7px 24px #0b183009}img{display:block;width:100%;height:auto}small{color:#667085}a{color:#5546e8}@media(max-width:800px){main{display:block}aside{max-height:none;display:flex;overflow:auto;gap:4px}button{min-width:155px;padding:9px}section{padding:12px}header{padding:12px}}</style></head><body><header><strong>◆ INPROOM · V2.1 Screen Review</strong><span>17 proposed UI screens · Synthetic examples</span></header><main><aside role="tablist" aria-label="UX screens"><button role="tab" id="tab-1" aria-controls="preview" aria-selected="true" data-n="1">UX-01 · Project Command Center</button><button role="tab" id="tab-2" aria-controls="preview" aria-selected="false" data-n="2">UX-02 · Create or Migrate Project</button><button role="tab" id="tab-3" aria-controls="preview" aria-selected="false" data-n="3">UX-03 · Integration Hub</button><button role="tab" id="tab-4" aria-controls="preview" aria-selected="false" data-n="4">UX-04 · Knowledge Explorer</button><button role="tab" id="tab-5" aria-controls="preview" aria-selected="false" data-n="5">UX-05 · Requirements Studio</button><button role="tab" id="tab-6" aria-controls="preview" aria-selected="false" data-n="6">UX-06 · Approval Inbox</button><button role="tab" id="tab-7" aria-controls="preview" aria-selected="false" data-n="7">UX-07 · Sprint Intelligence</button><button role="tab" id="tab-8" aria-controls="preview" aria-selected="false" data-n="8">UX-08 · Architecture &amp; Plan Editor</button><button role="tab" id="tab-9" aria-controls="preview" aria-selected="false" data-n="9">UX-09 · PR Verification</button><button role="tab" id="tab-10" aria-controls="preview" aria-selected="false" data-n="10">UX-10 · Release Center</button><button role="tab" id="tab-11" aria-controls="preview" aria-selected="false" data-n="11">UX-11 · QA Center</button><button role="tab" id="tab-12" aria-controls="preview" aria-selected="false" data-n="12">UX-12 · Test Execution</button><button role="tab" id="tab-13" aria-controls="preview" aria-selected="false" data-n="13">UX-13 · Agent Workbench</button><button role="tab" id="tab-14" aria-controls="preview" aria-selected="false" data-n="14">UX-14 · Model &amp; Harness Settings</button><button role="tab" id="tab-15" aria-controls="preview" aria-selected="false" data-n="15">UX-15 · Governance &amp; Audit</button><button role="tab" id="tab-16" aria-controls="preview" aria-selected="false" data-n="16">UX-16 · Team &amp; Permissions</button><button role="tab" id="tab-17" aria-controls="preview" aria-selected="false" data-n="17">UX-17 · First-run &amp; Recovery States</button></aside><section><h1 id="heading">Project Command Center</h1><p id="desc">Decisions, risks, source freshness and current execution</p><figure id="preview" role="tabpanel" aria-labelledby="tab-1"><img id="img" alt="INPROOM Project Command Center static proposed design" src="../screens/ux-01-project-command-center.svg"></figure><p style="margin-top:18px">This is a navigable design gallery. It does not run actual Jira, GitHub, Confluence or AI actions. <a href="../screen-specifications.md">Read functional specifications</a>.</p></section></main><script>const items=[{"n":1,"title":"Project Command Center","subtitle":"Decisions, risks, source freshness and current execution","file":"ux-01-project-command-center.svg"},{"n":2,"title":"Create or Migrate Project","subtitle":"Guided setup with explicit connector and permissions scope","file":"ux-02-project-onboarding.svg"},{"n":3,"title":"Integration Hub","subtitle":"Connection status, sync diagnostics, grants and source policies","file":"ux-03-integrations-hub.svg"},{"n":4,"title":"Knowledge Explorer","subtitle":"Search, inspect authoritative sources and understand relationships","file":"ux-04-knowledge-explorer.svg"},{"n":5,"title":"Requirements Studio","subtitle":"Turn documents and simple descriptions into approved implementation work","file":"ux-05-requirements-studio.svg"},{"n":6,"title":"Approval Inbox","subtitle":"Compare evidence and approve the exact external change","file":"ux-06-approval-inbox.svg"},{"n":7,"title":"Sprint Intelligence","subtitle":"Readiness, dependencies and implementation planning","file":"ux-07-sprint-intelligence.svg"},{"n":8,"title":"Architecture & Plan Editor","subtitle":"Versioned implementation plans with editable diagrams and review","file":"ux-08-architecture-planning.svg"},{"n":9,"title":"PR Verification","subtitle":"Acceptance criteria matched to actual Git changes and CI results","file":"ux-09-pull-request-verification.svg"},{"n":10,"title":"Release Center","subtitle":"Immutable candidates, readiness gates and deployment decisions","file":"ux-10-release-center.svg"},{"n":11,"title":"QA Center","subtitle":"Release-scoped test coverage, defects, QA assignment and sign-off","file":"ux-11-qa-center.svg"},{"n":12,"title":"Test Execution","subtitle":"Observed expected/actual outcomes with reproducible evidence","file":"ux-12-test-execution.svg"},{"n":13,"title":"Agent Workbench","subtitle":"Observable AI runs with policy, provenance, budget and human controls","file":"ux-13-agent-workbench.svg"},{"n":14,"title":"Model & Harness Settings","subtitle":"Choose compliant model providers, data boundaries and agent execution budgets","file":"ux-14-model-and-harness.svg"},{"n":15,"title":"Governance & Audit","subtitle":"Explain exactly who approved what, where it ran and what changed","file":"ux-15-governance-and-audit.svg"},{"n":16,"title":"Team & Permissions","subtitle":"Project memberships, effective access and scoped approvers","file":"ux-16-team-and-permissions.svg"},{"n":17,"title":"First-run & Recovery States","subtitle":"Useful first-run guidance, understandable failures and safe recovery","file":"ux-17-empty-error-recovery.svg"}];const tabs=[...document.querySelectorAll('[role=tab]')];function show(n){const s=items[n-1];document.getElementById('heading').textContent=s.title;document.getElementById('desc').textContent=s.subtitle;document.getElementById('img').src='../screens/'+s.file;document.getElementById('img').alt='INPROOM '+s.title+' proposed screen';tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.n===String(n)?'true':'false'));document.getElementById('preview').setAttribute('aria-labelledby','tab-'+n)}tabs.forEach(t=>t.addEventListener('click',()=>show(+t.dataset.n)));document.querySelector('aside').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();let i=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true');i=(i+(['ArrowDown','ArrowRight'].includes(e.key)?1:tabs.length-1))%tabs.length;show(i+1);tabs[i].focus()});</script></body></html>
