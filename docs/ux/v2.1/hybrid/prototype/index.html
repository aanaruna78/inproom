<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INPROOM · Hybrid Delivery UX</title><style>body{margin:0;background:#f7f8fa;color:#172033;font:14px system-ui,Arial}header{padding:16px 24px;background:#101828;color:#fff;display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px}main{max-width:1600px;padding:22px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{border:1px solid #e7e9ef;background:#fff;color:#344054;border-radius:8px;padding:12px;font:inherit;cursor:pointer}button[aria-selected=true]{background:#5546e8;color:#fff}button:focus-visible{outline:3px solid #067647;outline-offset:2px}.panel{border:1px solid #e7e9ef;background:white;padding:10px;border-radius:12px}.panel img{display:block;width:100%;height:auto}h1{font-size:24px}p{color:#667085}a{color:#5546e8}</style></head><body><header><strong>◆ INPROOM · Hybrid Delivery UX</strong><span>V2.2 · Five proposed screens</span></header><main><h1 id="title">Human Team & Invitations</h1><p id="description">Five-screen interaction design for hybrid humans/AI delivery. Illustrative visuals; no backend actions.</p><nav role="tablist" aria-label="Design screens"><button id="t19" role="tab" data-i="0" aria-selected="true" aria-controls="panel">Human Team &amp; Invitations</button><button id="t20" role="tab" data-i="1" aria-selected="false" aria-controls="panel">AI Agent &amp; Container Setup</button><button id="t21" role="tab" data-i="2" aria-selected="false" aria-controls="panel">Auto Allocate &amp; HIL Approval</button><button id="t22" role="tab" data-i="3" aria-selected="false" aria-controls="panel">Hybrid Sprint Control Center</button><button id="t23" role="tab" data-i="4" aria-selected="false" aria-controls="panel">AI Scrum Master &amp; Ceremonies</button></nav><section id="panel" class="panel" role="tabpanel" aria-labelledby="t19"><img id="image" src="../screens/ux-19-human-team-onboarding.svg" alt="Human Team and Invitations screen design"></section><p>These are not active forms, schedulers or agent services. <a href="../README.md">See screen specs and testing requirements.</a></p></main><script>const screens=[{"id":19,"title":"Human Team & Invitations","sub":"Verified developer and QA onboarding · skills, capacity and role controls","file":"ux-19-human-team-onboarding.svg"},{"id":20,"title":"AI Agent & Container Setup","sub":"Provider adapters · runtime isolation · credentials and capability checks","file":"ux-20-ai-agent-container-setup.svg"},{"id":21,"title":"Auto Allocate & HIL Approval","sub":"Explainable team matching · editable assignments · review before kickoff","file":"ux-21-auto-allocation-review.svg"},{"id":22,"title":"Hybrid Sprint Control Center","sub":"Two-week sprint · human and AI workload · real PR and QA evidence","file":"ux-22-hybrid-sprint-control-center.svg"},{"id":23,"title":"AI Scrum Master & Ceremonies","sub":"Project-local scheduling · cited daily sprint report · governed Jira comments","file":"ux-23-ai-scrum-master-control.svg"}];let tabs=[...document.querySelectorAll('[role=tab]')];function select(i){let s=screens[i];tabs.forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));document.getElementById('title').textContent=s.title;document.getElementById('description').textContent=s.sub;let p=document.getElementById('panel');p.setAttribute('aria-labelledby','t'+s.id);let im=document.getElementById('image');im.src='../screens/'+s.file;im.alt=s.title+' UI concept'}tabs.forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.i))));document.querySelector('nav').addEventListener('keydown',e=>{if(!['ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();let i=tabs.findIndex(b=>b.getAttribute('aria-selected')==='true');i=(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;select(i);tabs[i].focus()})</script></body></html>
