[project]
name = "inproom-api"
version = "0.1.0"
description = "INPROOM control-plane API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pyjwt[crypto]==2.10.1",
    "boto3==1.35.99",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "markdown-it-py==3.0.0",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL (INPROOM_TEST_DATABASE_URL) and the local object store"]
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:botocore"]
